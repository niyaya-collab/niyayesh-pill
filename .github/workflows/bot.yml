name: Pill reminder

on:
  workflow_dispatch:
  schedule:
    # One wake each hour. The shift itself keeps listening for nearly three
    # hours, so a late schedule does not put the bot to sleep. Nothing here
    # starts another workflow.
    - cron: "37 * * * *"

permissions:
  contents: write

concurrency:
  group: pill-reminder
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Listen
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PYTHONUNBUFFERED: "1"
          WATCH_SECONDS: "9600"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python bot.py --watch
      - name: Save data.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main || true
          git pull --rebase origin main || true
          date -u +%Y-%m-%dT%H:%M:%SZ > .heartbeat
          # never replace a filled data.json with an empty skeleton
          if [ -f data.json ]; then
            remote_size=$(git cat-file -s origin/main:data.json 2>/dev/null || echo 0)
            local_size=$(wc -c < data.json)
            if [ "$local_size" -ge 200 ] || [ "$remote_size" -lt 200 ]; then
              git add data.json
            else
              echo "Skip data.json overwrite (local too small vs remote)"
              git checkout origin/main -- data.json || true
            fi
          fi
          git add .heartbeat
          if ! git diff --cached --quiet; then
            git commit -m "Heartbeat + reminder data" || true
          fi
          git pull --rebase origin main || true
          git push origin HEAD:main || true
