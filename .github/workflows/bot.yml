name: Pill reminder

on:
  workflow_dispatch:
  schedule:
    - cron: "7,27,47 * * * *"

permissions:
  contents: write

concurrency:
  group: pill-reminder
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Listen
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PYTHONUNBUFFERED: "1"
          WATCH_SECONDS: "1140"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python bot.py --watch
      - name: Save data.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if ! git diff --cached --quiet; then
            git commit --trailer "Co-authored-by: Cursor <cursoragent@cursor.com>" -m "Update reminder data" || true
            git push || true
          fi